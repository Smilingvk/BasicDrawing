<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎨 TypeScript Drawing App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── DESIGN TOKENS ─────────────────────────────────────── */
    :root {
      --bg:        #0d0d14;
      --panel:     #13131f;
      --border:    #252538;
      --surface:   #1e1e30;
      --accent:    #6c63ff;
      --accent2:   #ff6b6b;
      --text:      #e8e6f0;
      --muted:     #6b6880;
      --canvas-bg: #1a1a2e;
      --radius:    8px;
      --font-ui:   'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* ── RESET ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      display: grid;
      grid-template-rows: 48px 1fr 32px;
      grid-template-columns: 220px 1fr;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── TOPBAR ────────────────────────────────────────────── */
    #topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    #topbar h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    #topbar h1 span { color: var(--accent); }

    .top-btn {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .top-btn button, .top-btn label {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .top-btn button:hover, .top-btn label:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .top-btn button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .top-btn button:disabled:hover {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }
    #btn-save {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #btn-save:hover { background: #5851e6; }

    /* ── SIDEBAR ────────────────────────────────────────────── */
    #sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* ── TOOLS ───────────────────────────────────────────────── */
    #tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    [data-tool] {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 6px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    [data-tool]:hover { border-color: var(--accent); color: var(--accent); }
    [data-tool].active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    [data-tool] .icon { font-size: 16px; display: block; margin-bottom: 2px; }
    [data-tool] .key  {
      font-family: var(--font-mono);
      font-size: 9px;
      opacity: 0.5;
    }

    /* ── SLIDERS ─────────────────────────────────────────────── */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slider-row input[type=range] {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }
    .slider-val {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      min-width: 36px;
      text-align: right;
    }

    /* ── COLOR ───────────────────────────────────────────────── */
    #color-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #color-preview {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #ffffff;
      flex-shrink: 0;
    }
    #color-picker {
      width: 36px;
      height: 36px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: var(--radius);
    }
    #color-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* ── PALETTE ─────────────────────────────────────────────── */
    #palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 5px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
    }
    .swatch:hover {
      transform: scale(1.15);
      border-color: var(--accent);
    }

    /* ── HISTORY INFO ────────────────────────────────────────── */
    #history-info {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* ── CANVAS AREA ─────────────────────────────────────────── */
    #canvas-wrapper {
      position: relative;
      overflow: hidden;
      background: var(--canvas-bg);
    }
    #canvas-wrapper.drag-over { outline: 2px dashed var(--accent); }
    canvas#canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* ── STATUSBAR ───────────────────────────────────────────── */
    #statusbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 20px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    #status { color: var(--text); flex: 1; }
    #statusbar span { white-space: nowrap; }

    /* ── SCROLLBAR ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── DROP HINT ───────────────────────────────────────────── */
    #drop-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      background: rgba(108,99,255,0.15);
      color: var(--accent);
      font-size: 22px;
      font-weight: 700;
    }
    #canvas-wrapper.drag-over #drop-hint { opacity: 1; }
  </style>
</head>
<body>

  <!-- ── TOPBAR ─────────────────────────────────────────────── -->
  <header id="topbar">
    <h1>🎨 <span>Draw</span>Studio</h1>
    <div class="top-btn">
      <button id="btn-undo" disabled>↩ Undo</button>
      <button id="btn-redo" disabled>↪ Redo</button>
      <button id="btn-clear">🗑 Clear</button>
      <label for="file-input">📂 Load</label>
      <input id="file-input" type="file" accept="image/*" style="display:none" />
      <button id="btn-save">💾 Save PNG</button>
    </div>
  </header>

  <!-- ── SIDEBAR ────────────────────────────────────────────── -->
  <aside id="sidebar">

    <!-- Tools -->
    <div>
      <div class="section-label">Tools</div>
      <div id="tools">
        <button data-tool="brush">
          <span class="icon">✏️</span>Brush<span class="key">B</span>
        </button>
        <button data-tool="eraser">
          <span class="icon">🧹</span>Eraser<span class="key">E</span>
        </button>
        <button data-tool="fill">
          <span class="icon">🪣</span>Fill<span class="key">F</span>
        </button>
        <button data-tool="eyedropper">
          <span class="icon">💉</span>Pick
        </button>
        <button data-tool="line">
          <span class="icon">📏</span>Line<span class="key">L</span>
        </button>
        <button data-tool="rect">
          <span class="icon">▭</span>Rect<span class="key">R</span>
        </button>
      </div>
    </div>

    <!-- Brush size -->
    <div>
      <div class="section-label">Brush Size</div>
      <div class="slider-row">
        <input type="range" id="size" min="1" max="100" value="8" />
        <span class="slider-val" id="size-label">8px</span>
      </div>
    </div>

    <!-- Opacity -->
    <div>
      <div class="section-label">Opacity</div>
      <div class="slider-row">
        <input type="range" id="opacity" min="0" max="1" step="0.01" value="1" />
        <span class="slider-val" id="opacity-label">100%</span>
      </div>
    </div>

    <!-- Color picker -->
    <div>
      <div class="section-label">Color</div>
      <div id="color-row">
        <div id="color-preview"></div>
        <input type="color" id="color-picker" value="#ffffff" title="Pick color" />
        <span id="color-label">Custom</span>
      </div>
    </div>

    <!-- Palette -->
    <div>
      <div class="section-label">Palette</div>
      <div id="palette"></div>
    </div>

    <!-- History -->
    <div>
      <div class="section-label">History</div>
      <div id="history-info">
        <span id="history-steps">1 step</span>
      </div>
    </div>

  </aside>

  <!-- ── CANVAS ──────────────────────────────────────────────── -->
  <main id="canvas-wrapper">
    <canvas id="canvas"></canvas>
    <div id="drop-hint">Drop image here</div>
  </main>

  <!-- ── STATUSBAR ───────────────────────────────────────────── -->
  <footer id="statusbar">
    <span id="status">Loading…</span>
    <span>Tool: <strong id="active-tool">Brush</strong></span>
    <span>📍 <span id="coords">0, 0</span></span>
    <span>Ctrl+Z / Ctrl+Y · B E F L R</span>
  </footer>

  <!-- ── Compiled TypeScript output ─────────────────────────── -->
  <script src="dist/app.js"></script>

</body>
</html>
